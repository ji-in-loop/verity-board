name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before typecheck: workspace packages (e.g. providers depending on
      # @verity-board/core) resolve each other's types from their built dist/index.d.ts (per
      # package.json's "types" field), which doesn't exist until that package is built.
      # Typechecking first fails on a fresh checkout with no prior dist/ — learned this the hard
      # way on nohello's CI, applying the fix here from the start.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run lint
