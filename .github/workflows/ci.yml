name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before typecheck: workspace packages (e.g. providers depending on
      # @verity-board/core) resolve each other's types from their built dist/index.d.ts (per
      # package.json's "types" field), which doesn't exist until that package is built.
      # Typechecking first fails on a fresh checkout with no prior dist/ — learned this the hard
      # way on nohello's CI, applying the fix here from the start.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:coverage
      # Each package's lcov.info records paths relative to that package's own
      # root (e.g. "src/index.ts"), which collide across packages once
      # uploaded together — prefix each with its package path so Codecov sees
      # e.g. "packages/core/src/index.ts" and can map lines back to the repo.
      - name: Normalize coverage paths to be repo-root-relative
        run: |
          for dir in packages/*/coverage; do
            pkg="${dir%/coverage}"
            if [ -f "$dir/lcov.info" ]; then
              sed -i "s|^SF:|SF:${pkg}/|" "$dir/lcov.info"
            fi
          done
      - uses: codecov/codecov-action@v4
        with:
          files: packages/*/coverage/lcov.info
          fail_ci_if_error: false
